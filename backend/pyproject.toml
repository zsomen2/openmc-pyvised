[project]
name = "pyvised-backend"
version = "0.1.0a0"
description = "OpenMC service of PyVised; runs inside the backend Docker container"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Zsombor Ménes" }]
# openmc is not on PyPI: the container gets it from conda-forge (see environment.yml)
dependencies = [
    "pyvised-protocol",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
pyvised-backend = "pyvised_backend.__main__:main"

[tool.uv.sources]
pyvised-protocol = { workspace = true }

# pyvised_course: helpers for course models (MCNP-style rebuilds), importable by builders
[tool.uv.build-backend]
module-name = ["pyvised_backend", "pyvised_course"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
