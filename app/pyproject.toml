[project]
name = "pyvised"
version = "1.0.2"
description = "GUI for OpenMC: geometry visualisation and simulation control"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
authors = [{ name = "Zsombor Ménes" }]
dependencies = [
    "pyvised-protocol",
    "PySide6>=6.12,<6.13",
    "pyqtgraph>=0.14",
    "numpy>=2.3",
    "httpx>=0.28",
    "qtawesome>=1.3",
]

[project.gui-scripts]
pyvised = "pyvised.__main__:main"

[tool.uv.sources]
pyvised-protocol = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
