[project]
name = "pyvised-protocol"
version = "0.1.0a0"
description = "Schemas and binary frames shared by the PyVised client and backend"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Zsombor Ménes" }]
dependencies = [
    "pydantic>=2.9",
    "numpy>=1.26",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
